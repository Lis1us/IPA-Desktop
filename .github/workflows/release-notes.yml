name: Sync release changelogs
on:
  push:
    branches: [main]
    paths:
      - 'changelogs/*.md'
      - .github/workflows/release-notes.yml
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: windows-release
  cancel-in-progress: false
jobs:
  notes:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - uses: actions/checkout@v4
      - name: Update descriptions of published releases
        shell: bash
        run: |
          set -euo pipefail
          gh api --paginate "repos/$GH_REPO/releases" --jq '.[].tag_name' > /tmp/ipa-release-tags
          for notes in changelogs/v*.md; do
            tag="$(basename "$notes" .md)"
            if ! grep -Fxq "$tag" /tmp/ipa-release-tags; then
              echo "Release $tag not published yet; notes ready for its next build."
              continue
            fi
            gh release edit "$tag" --notes-file "$notes"
          done
